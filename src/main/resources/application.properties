spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update


# Dialecto para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Pool Hikari para base remota (Neon)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000

# ====================== MONITORING ======================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# Tags para identificar la app en Grafana
management.metrics.tags.application=${spring.application.name}
management.metrics.export.prometheus.enabled=true

# ====================== CRON JOBS ======================
# Alerta de stock bajo (cada hora)
app.jobs.stock-alerta.cron=0 0 * * * *
app.jobs.stock-alerta.admin-email=${spring.mail.username}

# Limpieza de pedidos PENDIENTE antiguos (diario 2:00 AM)
app.jobs.pedidos-limpieza.cron=0 0 2 * * *
app.jobs.pedidos-limpieza.dias-pendiente=7

# Metricas de inventario para Grafana (cada 5 minutos)
app.jobs.metricas-inventario.cron=0 */5 * * * *

# Configuracion de logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false
logging.level.root=INFO
logging.level.org.hibernate.orm.deprecation=ERROR
logging.level.org.hibernate.engine.transaction.jta.platform.internal.JtaPlatformInitiator=WARN

spring.devtools.restart.enabled=false